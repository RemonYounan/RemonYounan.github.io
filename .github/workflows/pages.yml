# Publishes public/ to GitHub Pages.
#
# The deployable site is a subdirectory, not the repository root, so Pages is
# fed by this workflow rather than by the "deploy from a branch" setting —
# that option can only serve / or /docs. There is no build step: the WebP
# derivatives and the brand assets are committed, so the job just uploads.
#
# Enable once under Settings > Pages > Source: "GitHub Actions".
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; skip queued duplicates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
