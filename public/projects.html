<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FAFAF9" />

  <!-- Icons. The SVG is what modern browsers take; the .ico carries
       16/32/48 for older ones and Windows pins. Regenerate the set with
       tools/brand/build.py. -->
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/brand/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />

  <!-- The site answers on two hosts (GitHub Pages and the Cloudflare
       Worker), so the canonical names one of them and search engines
       stop treating the pair as duplicates. -->
  <link rel="canonical" href="https://remonyounan.github.io/projects.html" />

  <!-- Social preview. Absolute URLs: scrapers do not resolve relative
       paths. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Remon Younan" />
  <meta property="og:title" content="My work — Remon Younan" />

  <meta property="og:image" content="https://remonyounan.github.io/assets/brand/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Remon Younan — I design and build mobile apps. 12 apps built, 100k+ downloads, 4.6 average rating." />
  <meta name="twitter:card" content="summary_large_image" />


  <!-- Microsoft Clarity: heatmaps + session replay. Skipped on local
       origins so development traffic stays out of the reports. -->
  <script>
    (function () {
      var h = location.hostname;
      if (
        !h ||
        h === "localhost" ||
        h === "127.0.0.1" ||
        h === "[::1]" ||
        h === "::1" ||
        h.endsWith(".local")
      )
        return;
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "ykuj82xv8p");
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/contact-modal.css" />

  <script>
    (function () {
      function paintThemeColor() {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", document.documentElement.getAttribute("data-theme") === "dark" ? "#0E0C08" : "#FAFAF9");
      }
      window.paintThemeColor = paintThemeColor;
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = (q === "dark" || q === "light") ? q : localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      paintThemeColor();
      document.documentElement.classList.add("js");
    })();
  </script>
</head>
